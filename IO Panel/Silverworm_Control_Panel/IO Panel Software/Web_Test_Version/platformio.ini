[env:esp32-h2]
platform = espressif32
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200

; Increase upload speed for faster uploads
upload_speed = 460800

; Library dependencies - Only ArduinoJson needed (Wire and others are built-in)
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0

; Build flags for optimization
build_flags =
    -O2
    -Wall

; Configure monitor port (uncomment and adjust for your system)
; For Windows: COM3, COM4, etc.
; For Linux: /dev/ttyUSB0
; For Mac: /dev/cu.usbserial-*
; monitor_port = COM3
